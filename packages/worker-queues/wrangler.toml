name = "cloudflare-spike-queues"
main = "src/index.ts"
compatibility_date = "2026-05-15"
workers_dev = true
preview_urls = true

[dev]
port = 8793
inspector_port = 9236

[[queues.producers]]
binding = "QUEUE"
queue = "spike-queues"

[[queues.consumers]]
queue = "spike-queues"
max_batch_size = 10
max_batch_timeout = 5

[vars]
VERSION = "dev"

[[routes]]
pattern = "cloudflare-spike.iaingalloway.com/queues*"
zone_name = "iaingalloway.com"
